# fly.toml app configuration for d3d-render
# See https://fly.io/docs/reference/configuration/

app = 'd3d-render'
primary_region = 'dfw'

[build]

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
